<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · Mercado — COMOCOMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fff7e6; --ink:#1b1712; --tomato:#e8452c; --mustard:#f5b82e; --green:#2f7d4f; --sky:#9fd1e8; --pink:#f6a6b2; --paper:#fffdf8; }
  * { box-sizing:border-box; margin:0 }
  body { background:var(--bg); color:var(--ink); font:17px/1.5 "Bricolage Grotesque", system-ui, sans-serif; }
  .wrap { max-width:1240px; margin:0 auto; padding:0 24px }
  header .wrap { display:flex; justify-content:space-between; align-items:center; height:76px }
  .logo { font-weight:800; font-size:26px; letter-spacing:-.03em; background:var(--ink); color:var(--bg); padding:4px 12px; border-radius:10px; transform:rotate(-2deg) }
  .logo span { color:var(--mustard) }
  .hero { background:var(--tomato); color:var(--paper); border-radius:32px; padding:56px 48px 48px; position:relative; overflow:hidden }
  .hero h1 { font-weight:800; font-size:clamp(48px,8vw,124px); line-height:.86; letter-spacing:-.05em; max-width:900px }
  .hero h1 span { color:var(--mustard) }
  .hero p { font-size:20px; max-width:520px; margin:18px 0 26px; opacity:.95 }
  .search { display:flex; gap:10px; max-width:720px }
  .search input { flex:1; border:3px solid var(--ink); border-radius:16px; padding:16px 18px; font:600 20px "Bricolage Grotesque"; background:var(--paper); outline:none; box-shadow:5px 5px 0 var(--ink) }
  .search input:focus { transform:translate(-1px,-1px); box-shadow:7px 7px 0 var(--ink) }
  .stickers { display:flex; gap:10px; flex-wrap:wrap; margin-top:22px }
  .stickers button { border:3px solid var(--ink); border-radius:999px; padding:8px 16px; font:800 15px "Bricolage Grotesque"; cursor:pointer; box-shadow:3px 3px 0 var(--ink); background:var(--paper) }
  .stickers button:nth-child(2) { background:var(--mustard) } .stickers button:nth-child(3) { background:var(--sky) } .stickers button:nth-child(4) { background:var(--pink) } .stickers button:nth-child(5) { background:#c9e7a6 }
  .stickers button:active { transform:translate(3px,3px); box-shadow:none }
  .blob { position:absolute; right:-60px; top:-60px; width:300px; height:300px; border-radius:50%; background:var(--mustard); mix-blend-mode:multiply; opacity:.9 }
  .bar { display:flex; justify-content:space-between; align-items:center; margin:36px 0 18px }
  .bar h2 { font-weight:800; font-size:40px; letter-spacing:-.03em }
  .persons { display:flex; align-items:center; gap:10px; border:3px solid var(--ink); border-radius:16px; padding:6px; background:var(--paper); box-shadow:4px 4px 0 var(--ink) }
  .persons button { width:40px; height:40px; border:0; border-radius:10px; background:var(--mustard); font:800 20px "Bricolage Grotesque"; cursor:pointer }
  .persons b { font-weight:800; min-width:96px; text-align:center }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:22px; padding-bottom:64px }
  .card { border:3px solid var(--ink); border-radius:22px; overflow:hidden; background:var(--paper); cursor:pointer; box-shadow:6px 6px 0 var(--ink); transition:transform .15s, box-shadow .15s }
  .card:hover { transform:translate(-2px,-2px) rotate(-.4deg); box-shadow:9px 9px 0 var(--ink) }
  .card img { width:100%; aspect-ratio:1; object-fit:cover; border-bottom:3px solid var(--ink); display:block }
  .card .t { padding:14px 16px 16px }
  .card small { font:600 12px "JetBrains Mono"; text-transform:uppercase }
  .card h3 { font-weight:800; font-size:22px; line-height:1.05; letter-spacing:-.02em; margin:6px 0 12px }
  .tag { display:inline-flex; gap:8px; align-items:baseline; background:var(--mustard); border:2px solid var(--ink); border-radius:10px; padding:3px 10px; font:600 14px "JetBrains Mono" }
  .tag b { font-family:"Bricolage Grotesque"; font-weight:800; font-size:18px }
  .card:nth-child(4n+2) .tag { background:var(--sky) } .card:nth-child(4n+3) .tag { background:var(--pink) } .card:nth-child(4n) .tag { background:#c9e7a6 }
  .detail { display:grid; grid-template-columns:1.2fr .8fr; gap:32px; padding-bottom:96px }
  .d-main { background:var(--paper); border:3px solid var(--ink); border-radius:28px; overflow:hidden; box-shadow:8px 8px 0 var(--ink) }
  .d-main img { width:100%; aspect-ratio:16/9; object-fit:cover; border-bottom:3px solid var(--ink); display:block }
  .d-main .in { padding:28px 32px 36px }
  .d-main h2 { font-weight:800; font-size:clamp(36px,5vw,64px); line-height:.95; letter-spacing:-.04em; margin:8px 0 12px }
  .meta { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 24px }
  .meta span { border:2px solid var(--ink); border-radius:999px; padding:4px 12px; font-weight:600; font-size:15px }
  .steps li { list-style:none; display:grid; grid-template-columns:52px 1fr; gap:10px; padding:14px 0; border-top:2px dashed #d8cdb8; font-size:18px }
  .steps li b { width:40px; height:40px; border-radius:50%; background:var(--tomato); color:var(--paper); display:grid; place-items:center; font-weight:800 }
  .steps { padding:0 }
  /* Ticket del súper */
  .ticket { background:#fff; font:400 15px/1.5 "JetBrains Mono", monospace; padding:28px 24px; align-self:start; position:sticky; top:20px; filter:drop-shadow(6px 6px 0 var(--ink)); --z:10px;
    -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 90deg, #0000 91deg) bottom / var(--z) 51% repeat-x, conic-gradient(from 135deg at top, #0000, #000 1deg 90deg, #0000 91deg) top / var(--z) 51% repeat-x; }
  .ticket h4 { text-align:center; font-weight:600; letter-spacing:.2em; margin-bottom:4px }
  .ticket .c { text-align:center; color:#6c6358; font-size:13px }
  .ticket hr { border:0; border-top:2px dashed #bbb; margin:14px 0 }
  .ticket .l { display:flex; justify-content:space-between; gap:12px }
  .ticket .l span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .ticket .tot { display:flex; justify-content:space-between; font-weight:600; font-size:22px }
  @media (max-width: 900px) {
    .hero { padding:36px 22px; border-radius:24px }
    .grid { grid-template-columns:repeat(2,1fr); gap:14px }
    .detail { grid-template-columns:1fr }
    .ticket { position:static }
    .bar h2 { font-size:30px }
  }
</style>
<script src="data.js"></script>
<script>
window.VIEW = {
  card: (r, n) => `<article class="card" data-open="${r.id}" tabindex="0"><img src="img/${r.id}.jpg" alt=""><div class="t"><small>${r.cuisine} · ${r.time}</small><h3>${r.title.replace(/\s*\(.*\)/, "")}</h3><span class="tag"><b>${fmtPrice(r, n).replace("≈ ", "")}</b> ${n} pers.</span></div></article>`,
  empty: (q) => `<p style="grid-column:1/-1;font-weight:800;font-size:28px">Ni rastro de «${q}». ¿Probamos otra cosa?</p>`,
  detail: (r, n) => `
    <div class="d-main"><img src="img/${r.id}.jpg" alt=""><div class="in">
      <small style="font:600 13px 'JetBrains Mono';text-transform:uppercase">${r.cuisine}</small>
      <h2>${r.title.replace(/\s*\(.*\)/, "")}</h2>
      <div class="meta"><span>⏱ ${r.time}</span><span>${r.difficulty}</span><span>${n} personas</span></div>
      <ol class="steps">${r.steps.map((s, k) => `<li><b>${k + 1}</b><span>${s}</span></li>`).join("")}</ol>
    </div></div>
    <aside class="ticket" aria-label="Lista de la compra">
      <h4>COMOCOMO</h4><p class="c">${r.title.replace(/\s*\(.*\)/, "").toUpperCase()}<br>${n} PERSONAS</p><hr>
      ${r.ingredients.filter((i) => !i.optional).map((i) => `<div class="l"><span>${i.name}</span><span>${fmtQty(i, n)}</span></div>`).join("")}
      <hr><div class="tot"><span>TOTAL</span><span>${fmtPrice(r, n)}</span></div>
      <p class="c" style="margin-top:12px">Aprox. · envases completos<br>sin sal, aceite ni especias</p>
    </aside>`,
};
</script>
<script src="common.js"></script>
</head>
<body>
<header><div class="wrap"><div class="logo">como<span>cómo</span></div></div></header>
<main class="wrap">
  <section class="hero">
    <div class="blob"></div>
    <h1>¿Qué cocinamos <span>hoy?</span></h1>
    <p>Busca un plato y te damos la receta, la lista de la compra y lo que te va a costar.</p>
    <div class="search"><input data-search placeholder="Ej: tortilla, tacos, pollo…" aria-label="Buscar recetas"></div>
    <div class="stickers"><button data-q="">Todas</button><button data-q="España">España</button><button data-q="Italia">Italia</button><button data-q="México">México</button><button data-q="Japón">Japón</button></div>
  </section>
  <div class="bar"><h2>Recetas</h2><div class="persons"><button data-step="-1" aria-label="Menos personas">−</button><b><span data-n>4</span> personas</b><button data-step="1" aria-label="Más personas">+</button></div></div>
  <section class="grid" id="grid"></section>
  <section class="detail" id="detail"></section>
</main>
</body></html>
