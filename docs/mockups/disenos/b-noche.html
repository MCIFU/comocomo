<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>B · Noche — COMOCOMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0e0d0c; --panel:#1a1816; --ink:#f4efe8; --muted:#a39b91; --line:#2c2925; --accent:#ffb23f; }
  * { box-sizing:border-box; margin:0 }
  body { background:var(--bg); color:var(--ink); font:16px/1.55 "Space Grotesk", system-ui, sans-serif; }
  .wrap { max-width:1280px; margin:0 auto; padding:0 28px }
  header { position:absolute; inset:0 0 auto 0; z-index:3 }
  header .wrap { display:flex; justify-content:space-between; align-items:center; height:72px }
  .logo { font-weight:700; font-size:20px; letter-spacing:-.02em } .logo span { color:var(--accent) }
  header a { color:var(--ink); text-decoration:none; font-size:14px; opacity:.85; margin-left:24px }
  .hero { position:relative; min-height:78vh; display:flex; align-items:flex-end; overflow:hidden }
  .hero img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scale(1.04) }
  .hero::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(14,13,12,.35) 0%, rgba(14,13,12,.2) 40%, var(--bg) 100%) }
  .hero .wrap { position:relative; z-index:2; padding-bottom:56px; width:100% }
  .hero h1 { font-weight:700; font-size:clamp(46px,7.5vw,112px); line-height:.92; letter-spacing:-.045em; max-width:900px }
  .hero h1 span { color:var(--accent) }
  .search { margin-top:28px; display:flex; max-width:640px; background:var(--ink); border-radius:999px; padding:6px }
  .search input { flex:1; border:0; background:transparent; font:500 18px "Space Grotesk"; padding:12px 20px; outline:none; color:#111 }
  .search button { border:0; border-radius:999px; background:var(--accent); color:#111; font:700 15px "Space Grotesk"; padding:0 24px; cursor:pointer }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px }
  .chips button { border:1px solid rgba(244,239,232,.35); background:rgba(14,13,12,.4); color:var(--ink); border-radius:999px; padding:8px 14px; font:500 14px "Space Grotesk"; cursor:pointer }
  .chips button:hover { background:var(--ink); color:#111 }
  .bar { display:flex; justify-content:space-between; align-items:center; padding:28px 0 18px }
  .bar h2 { font-size:28px; letter-spacing:-.02em }
  .persons { display:flex; align-items:center; gap:4px; background:var(--panel); border-radius:999px; padding:4px }
  .persons button { width:38px; height:38px; border:0; border-radius:50%; background:#2c2925; color:var(--ink); font-size:18px; cursor:pointer }
  .persons b { min-width:110px; text-align:center; font-weight:500 }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; padding-bottom:72px }
  .card { position:relative; aspect-ratio:3/4; border-radius:18px; overflow:hidden; cursor:pointer; background:var(--panel) }
  .card img { width:100%; height:100%; object-fit:cover; transition:transform .5s cubic-bezier(.2,0,0,1) }
  .card:hover img { transform:scale(1.06) }
  .card::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 45%, rgba(0,0,0,.85)) }
  .card .t { position:absolute; left:16px; right:16px; bottom:14px; z-index:2 }
  .card small { color:var(--muted); font-size:13px }
  .card h3 { font-size:22px; line-height:1.1; letter-spacing:-.02em; margin:4px 0 10px }
  .pill { display:inline-block; background:var(--accent); color:#111; font-weight:700; border-radius:999px; padding:4px 12px; font-size:14px }
  .card .pill + span { color:var(--muted); font-size:13px; margin-left:8px }
  .detail { background:var(--panel); border-radius:28px; padding:40px; margin-bottom:80px; display:grid; grid-template-columns:420px 1fr; gap:48px }
  .detail img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:20px }
  .detail h2 { font-size:clamp(34px,4vw,56px); line-height:1; letter-spacing:-.035em; margin:14px 0 10px }
  .detail .note { color:var(--muted) }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:22px 0 }
  .stats div { background:var(--bg); border-radius:14px; padding:14px }
  .stats small { color:var(--muted); font-size:12px; display:block }
  .stats b { font-size:22px }
  .stats .hl { background:var(--accent); color:#111 } .stats .hl small { color:#3d2a00 }
  h4 { font-size:13px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); margin:8px 0 12px }
  .ing { display:grid; grid-template-columns:1fr 1fr; gap:8px 18px }
  .ing div { display:flex; justify-content:space-between; border-bottom:1px solid var(--line); padding:8px 0 }
  .ing span:last-child { color:var(--accent); font-variant-numeric:tabular-nums }
  .steps { display:grid; gap:10px; margin-top:8px }
  .steps div { background:var(--bg); border-radius:14px; padding:16px 18px; display:grid; grid-template-columns:38px 1fr; gap:6px }
  .steps b { color:var(--accent); font-size:18px }
  .muted { color:var(--muted); font-size:13px }
  @media (max-width: 900px) {
    .grid { grid-template-columns:repeat(2,1fr); gap:10px }
    .detail { grid-template-columns:1fr; padding:20px; border-radius:20px }
    .ing { grid-template-columns:1fr }
    header a { display:none }
  }
</style>
<script src="data.js"></script>
<script>
window.VIEW = {
  card: (r, n) => `<article class="card" data-open="${r.id}" tabindex="0"><img src="img/${r.id}.jpg" alt=""><div class="t"><small>${r.cuisine} · ${r.time}</small><h3>${r.title.replace(/\s*\(.*\)/, "")}</h3><span class="pill">${fmtPrice(r, n)}</span><span>${n} pers.</span></div></article>`,
  empty: (q) => `<p class="muted" style="grid-column:1/-1;font-size:20px">Nada con «${q}». Prueba con otro plato.</p>`,
  detail: (r, n) => `
    <img src="img/${r.id}.jpg" alt="">
    <div>
      <span class="muted">${r.cuisine} · ${r.difficulty}</span>
      <h2>${r.title.replace(/\s*\(.*\)/, "")}</h2>
      <p class="note">${r.note}</p>
      <div class="stats"><div><small>Tiempo</small><b>${r.time}</b></div><div><small>Personas</small><b>${n}</b></div><div class="hl"><small>Compra aprox.</small><b>${fmtPrice(r, n)}</b></div></div>
      <h4>Ingredientes</h4>
      <div class="ing">${r.ingredients.map((i) => `<div><span>${i.name}</span><span>${fmtQty(i, n)}</span></div>`).join("")}</div>
      <h4 style="margin-top:28px">Paso a paso</h4>
      <div class="steps">${r.steps.map((s, k) => `<div><b>${k + 1}</b><span>${s}</span></div>`).join("")}</div>
      <p class="muted" style="margin-top:16px">Compra aproximada con envases completos, sin sal, aceite ni especias básicas.</p>
    </div>`,
};
</script>
<script src="common.js"></script>
</head>
<body>
<header><div class="wrap"><div class="logo">cómo<span>como</span></div><nav><a>Recetas</a><a>Guardadas</a></nav></div></header>
<section class="hero">
  <img src="img/fabada-asturiana.jpg" alt="">
  <div class="wrap">
    <h1>¿Qué cocinamos <span>hoy?</span></h1>
    <label class="search"><input data-search placeholder="Busca un plato o un ingrediente" aria-label="Buscar recetas"><button type="button">Buscar</button></label>
    <div class="chips"><button data-q="">Todas</button><button data-q="España">España</button><button data-q="Italia">Italia</button><button data-q="México">México</button><button data-q="Japón">Japón</button><button data-q="pollo">Con pollo</button></div>
  </div>
</section>
<main class="wrap">
  <div class="bar"><h2>Recetas</h2><div class="persons"><button data-step="-1" aria-label="Menos personas">−</button><b><span data-n>4</span> personas</b><button data-step="1" aria-label="Más personas">+</button></div></div>
  <section class="grid" id="grid"></section>
  <section class="detail" id="detail"></section>
</main>
</body></html>
